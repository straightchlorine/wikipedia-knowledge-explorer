[project]
name = "wikipedia-knowledge-explorer-backend"
version = "0.1.0"
description = "Wikipedia Knowledge Explorer - Backend API"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.135.3",
    "uvicorn==0.43.0",
    "httpx==0.28.1",
    "python-dotenv==1.2.2",
    "pydantic-settings==2.14.1",
    "scikit-learn==1.8.0",
    "nltk==3.9.4",
    "sentence-transformers==5.3.0",
    "transformers==5.5.0",
    "torch==2.11.0",
    "slowapi==0.1.9",
    "redis[hiredis]==6.4.0",
    "prometheus-client==0.23.1",
]

[dependency-groups]
dev = [
    "fakeredis==2.35.1",
    "pytest==9.0.2",
    "pytest-asyncio==1.3.0",
    "pytest-cov==7.1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
