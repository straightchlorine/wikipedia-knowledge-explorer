[project]
name = "wke-summarizer"
version = "0.1.0"
description = "Wikipedia Knowledge Explorer - Summarization inference service"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.135.3",
    "uvicorn==0.43.0",
    "pydantic==2.13.2",
    "pydantic-settings==2.12.0",
    "slowapi==0.1.9",
    "transformers==5.5.0",
    "torch==2.11.0",
]

[dependency-groups]
dev = [
    "pytest==9.0.2",
    "pytest-asyncio==1.3.0",
    "httpx==0.28.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]
